name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&size_weight=0.5&count_weight=0.5&exclude_repo=Portfolio---Sass-tutorial,pragmartagency,calculator-,alphaoilcooperation,Audiophile,payapi,example,Easybank-landing-pge,meet-landing-page,Fylo-landing-page,manage-landing-page,loopstudios,shortly,Crappo,MusicApp,PixelAI,coinviewr,search-x,code-byte,portfolio,web3-dao-demo,neb-demo,gakmels-cages,dev-mind,test-stamp-nft,dashboard,CWEmbassy,crater-demo,crypto-invest,shadcn-admin,ssh-ai-chat,TradingAgents,TradingAgents-CN,100-Days-Of-ML-Code,build-your-own-x,every-programmer-should-know&custom_title=Current%20Code%20Languages&theme=transparent&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Reorder language card rows
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("profile/top-langs.svg")
          svg = path.read_text()

          pattern = re.compile(
              r'<g class="stagger" style="animation-delay: \d+ms">.*?</g>',
              re.DOTALL,
          )
          blocks = pattern.findall(svg)

          if len(blocks) == 6:
              # The compact renderer fills columns as [1,2,3] [4,5,6].
              # Reorder the six rendered entries so rows become:
              # [1,2], [3,4], [5,6].
              reordered = [blocks[0], blocks[2], blocks[4], blocks[1], blocks[3], blocks[5]]
              iterator = iter(reordered)
              svg = pattern.sub(lambda _: next(iterator), svg)
              path.write_text(svg)
          else:
              raise RuntimeError(f"Expected 6 language entries, found {len(blocks)}")

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=00000000&disable_animations=true&timezone=Africa/Lagos
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit profile stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "Profile stats are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile stats"

          for attempt in 1 2 3; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep 2
          done

          echo "Failed to push profile stats after 3 attempts."
          exit 1
